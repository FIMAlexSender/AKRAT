[workspace]
resolver = "2"
members = ["crates/akrat-trust", "crates/akrat-core", "crates/akrat-cli", "crates/akrat-desktop", "crates/akrat-mailbox", "crates/akrat-relay", "crates/akrat-node-updater"]

[workspace.package]
version = "0.1.13"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.93.1"

[workspace.dependencies]
aes-gcm = "0.11.1"
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
argon2 = "0.6"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dioxus = { version = "0.7.10" }
dioxus-desktop = "0.7.10"
directories = "6"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde"] }
getrandom = "0.4"
hex = "0.4"
fs2 = "0.4"
iroh = { version = "=1.4.1", features = ["unstable-custom-transports"] }
iroh-base = "=1.4.1"
rpassword = "7.4"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
snow = "0.10.0"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = { version = "1", features = ["derive"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
