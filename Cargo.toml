[workspace]
resolver = "2"
members = ["crates/akrat-core", "crates/akrat-cli", "crates/akrat-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive"] }
dioxus = { version = "0.7.10", features = ["desktop"] }
dioxus-desktop = "0.7.10"
directories = "6"
getrandom = "0.4"
hex = "0.4"
rpassword = "7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
snow = "0.10.0"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize = { version = "1", features = ["derive"] }
