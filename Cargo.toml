[workspace]
resolver = "2"
members = [
    "crates/akrat-app",
    "crates/akrat-core",
    "crates/akrat-crypto",
    "crates/akrat-network",
    "crates/akrat-protocol",
    "crates/akrat-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.11.1"
argon2 = "0.5.3"
getrandom = "0.4"
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
ed25519-dalek = "3"
hex = "0.4"
thiserror = "2"
hkdf = "0.13"
hmac = "0.13"
ml-kem = { version = "0.3.4", features = ["getrandom", "zeroize"] }
x25519-dalek = { version = "3", features = ["getrandom"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

