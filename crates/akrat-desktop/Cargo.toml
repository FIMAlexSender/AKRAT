[package]
name = "akrat-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
akrat-core = { path = "../akrat-core" }
akrat-mailbox = { path = "../akrat-mailbox" }
base64.workspace = true
dioxus = { workspace = true }
dioxus-desktop = { workspace = true, optional = true }
directories.workspace = true
getrandom.workspace = true
hex.workspace = true
iroh.workspace = true
chrono.workspace = true
reqwest.workspace = true
rfd = { version = "0.17.2", optional = true }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
zeroize.workspace = true
zip = { workspace = true, optional = true }
self-replace = { version = "1.5.1", optional = true }

[dev-dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "dep:dioxus-desktop", "dep:rfd", "dep:self-replace", "dep:zip"]
mobile = ["dioxus/mobile"]
