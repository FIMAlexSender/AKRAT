[package]
name = "akrat-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
akrat-trust = { version = "=0.1.12", path = "../akrat-trust", features = ["client"] }
akrat-core = { version = "=0.1.12", path = "../akrat-core" }
akrat-mailbox = { version = "=0.1.12", path = "../akrat-mailbox" }
base64.workspace = true
dioxus = { workspace = true }
dioxus-desktop = { workspace = true, optional = true }
directories.workspace = true
getrandom.workspace = true
hex.workspace = true
iroh.workspace = true
chrono.workspace = true
reqwest.workspace = true
rfd = { version = "0.17.2", optional = true }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
zeroize.workspace = true
zip = { workspace = true, optional = true }
self-replace = { version = "1.5.1", optional = true }
trash = { version = "5.3.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
ed25519-dalek.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled"] }
tempfile = "3"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "dep:dioxus-desktop", "dep:rfd", "dep:self-replace", "dep:trash", "dep:zip"]
mobile = ["dioxus/mobile"]
