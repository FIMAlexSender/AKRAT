[package]
name = "akrat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["media-image", "markdown", "p2p"]
media-image = ["dep:image"]
markdown = ["dep:pulldown-cmark"]
p2p = ["dep:iroh"]

[dependencies]
akrat-trust = { version = "=0.1.13", path = "../akrat-trust" }
aes-gcm.workspace = true
argon2.workspace = true
base64.workspace = true
getrandom.workspace = true
hex.workspace = true
fs2.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
iroh = { workspace = true, optional = true }
iroh-base.workspace = true
libsignal-protocol = { version = "=0.1.0", git = "https://github.com/signalapp/libsignal", rev = "0abcfd4044a5827d73b657c1170ab3638d660330" }
pulldown-cmark = { version = "0.13.4", optional = true }
rand = "0.9"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
snow.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
iroh = { version = "=1.4.1", features = ["test-utils"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
