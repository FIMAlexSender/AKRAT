name: Build AKRAT

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && 'akrat-release-build' || format('akrat-ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    name: Desktop · ${{ matrix.os }}
    needs: desktop-windows-local
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: akrat-linux-local
            artifact: linux-x64
            app: target/release/akrat-desktop
            cli: target/release/akrat
            mailbox: target/release/akrat-mailbox
            relay: target/release/akrat-relay
    runs-on: [self-hosted, Linux, X64, "${{ matrix.os }}"]
    env:
      CARGO_INCREMENTAL: '1'
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Prepare build metrics directory
        run: python3 -c 'import shutil; shutil.rmtree("target/ci-metrics", ignore_errors=True)'

      - name: Verify Linux runner prerequisites
        if: runner.os == 'Linux'
        run: |
          pkg-config --exists webkit2gtk-4.1 gtk+-3.0 openssl
          protoc --version

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Test workspace and formatting
        run: |
          cargo fmt --all -- --check
          python3 scripts/ci/measure_process.py linux-clippy -- cargo clippy --locked --workspace --all-targets -- -D warnings
          python3 scripts/ci/measure_process.py linux-tests -- cargo test --locked --workspace

      - name: Audit Rust dependencies
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          cargo install cargo-audit --version 0.23.0 --locked --root target/security-tools --target-dir target
          cargo install cargo-deny --version 0.20.2 --locked --root target/security-tools --target-dir target
          target/security-tools/bin/cargo-audit audit
          target/security-tools/bin/cargo-deny check -W unmaintained -W unsound --hide-inclusion-graph

      - name: Build desktop app and CLI
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          export AKRAT_BUILD_COMMIT="$GITHUB_SHA"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export AKRAT_RELAY_ARTIFACT_NAME="AKRAT-${GITHUB_REF_NAME}-relay-linux-x64"
          else
            export AKRAT_RELAY_ARTIFACT_NAME="akrat-relay-linux-x64"
          fi
          python3 scripts/ci/measure_process.py linux-release -- cargo build --locked --release --workspace
          python3 scripts/ci/measure_process.py linux-iroh-relay -- cargo install iroh-relay --version 1.4.1 --features server --locked --root target/relay-tools --target-dir target
          cp target/relay-tools/bin/iroh-relay target/release/iroh-relay
          cp packaging/relay/akrat-node.sh packaging/relay/akrat-node.ps1 packaging/relay/iroh-relay.toml.example packaging/relay/akrat-node.service packaging/relay/akrat-node-updater.service packaging/relay/akrat-node-updater.timer packaging/relay/akrat-node-updater.json.example packaging/relay/README.md target/release/
          python3 scripts/ci/record_artifact_sizes.py linux target/release/akrat-desktop target/release/akrat target/release/akrat-mailbox target/release/akrat-relay target/release/akrat-node-updater target/release/iroh-relay

      - name: Verify official signing key against production trust root
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/v0.1.13-node-autoupdate'
        shell: bash
        env:
          AKRAT_RELEASE_SIGNING_SEED: ${{ secrets.AKRAT_RELEASE_SIGNING_SEED }}
        run: |
          set -euo pipefail
          test -n "$AKRAT_RELEASE_SIGNING_SEED"
          cargo run --locked -p akrat-trust --features release-signer \
            --bin akrat-sign-release-attestation -- --check-key

      - uses: actions/upload-artifact@v4
        with:
          name: akrat-${{ matrix.artifact }}
          path: |
            ${{ matrix.app }}
            ${{ matrix.cli }}
            ${{ matrix.mailbox }}
            ${{ matrix.relay }}
            target/release/akrat-node-updater
            target/release/iroh-relay
            target/release/akrat-node.sh
            target/release/akrat-node.ps1
            target/release/iroh-relay.toml.example
            target/release/akrat-node.service
            target/release/akrat-node-updater.service
            target/release/akrat-node-updater.timer
            target/release/akrat-node-updater.json.example
            target/release/README.md
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akrat-metrics-linux
          path: target/ci-metrics/*.json
          if-no-files-found: ignore
          retention-days: 14

  desktop-windows-local:
    name: Desktop Windows · PC AKRAT
    runs-on: [self-hosted, Windows, X64, akrat-local]
    env:
      RUSTUP_TOOLCHAIN: 1.100.0
      CARGO_INCREMENTAL: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Prepare build metrics directory
        shell: powershell
        run: Remove-Item 'target\ci-metrics' -Recurse -Force -ErrorAction SilentlyContinue

      - name: Install pinned protobuf compiler
        shell: powershell
        run: |
          $toolsRoot = Join-Path $env:LOCALAPPDATA 'AKRAT\ci-tools'
          $archive = Join-Path $toolsRoot 'protoc-36.2-win64.zip'
          $root = Join-Path $toolsRoot 'protoc-36.2'
          New-Item -ItemType Directory -Force -Path $toolsRoot | Out-Null
          if (-not (Test-Path -LiteralPath $archive)) { Invoke-WebRequest -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-win64.zip' -OutFile $archive }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3') {
            Remove-Item -LiteralPath $archive -Force
            Invoke-WebRequest -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-win64.zip' -OutFile $archive
            $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne 'f0c128dc0d8492eceece83bb459a4c0e316764b929ffbf1aa416357fd644edd3') { throw "protoc archive SHA-256 mismatch: $hash" }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'bin\protoc.exe'))) { Expand-Archive -LiteralPath $archive -DestinationPath $root -Force }
          "$root\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$root\bin\protoc.exe" --version

      - name: Verify Rust toolchain on the AKRAT PC
        shell: powershell
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
          cargo --version
          rustc --version

      - name: Test workspace and formatting
        shell: powershell
        run: |
          cargo fmt --all -- --check
          & .\scripts\ci\measure-process.ps1 -Name windows-debug -Command 'cargo clippy --locked --workspace --all-targets -- -D warnings && cargo test --locked --workspace'

      - name: Build desktop app and CLI with MSVC
        shell: powershell
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ Build Tools are required on the AKRAT runner.' }
          $devCmd = Join-Path $vsPath 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $devCmd)) { throw "MSVC setup script not found: $devCmd" }
          $stableRustc = (& rustup which --toolchain 1.100.0 rustc).Trim()
          $stableCargo = (& rustup which --toolchain 1.100.0 cargo).Trim()
          if (-not (Test-Path $stableRustc) -or -not (Test-Path $stableCargo)) { throw 'The pinned Rust toolchain is incomplete on the AKRAT runner.' }
          $artifactName = if ($env:GITHUB_REF_TYPE -eq 'tag') { "AKRAT-$($env:GITHUB_REF_NAME)-relay-windows-x64.exe" } else { 'akrat-relay-windows-x64.exe' }
          $commands = '"' + $devCmd + '" -arch=x64 -host_arch=x64 -no_logo && set "RUSTUP_TOOLCHAIN=1.100.0" && set "RUSTC=' + $stableRustc + '" && set "CARGO_INCREMENTAL=0" && set "AKRAT_BUILD_COMMIT=' + $env:GITHUB_SHA + '" && set "AKRAT_RELAY_ARTIFACT_NAME=' + $artifactName + '" && "' + $stableCargo + '" build --locked --release --workspace && "' + $stableCargo + '" install iroh-relay --version 1.4.1 --features server --locked --root target/relay-tools --target-dir target && copy /Y target\relay-tools\bin\iroh-relay.exe target\release\iroh-relay.exe'
          & .\scripts\ci\measure-process.ps1 -Name windows-release -Command $commands
          Copy-Item 'packaging\relay\akrat-node.sh','packaging\relay\akrat-node.ps1','packaging\relay\iroh-relay.toml.example','packaging\relay\akrat-node.service','packaging\relay\README.md' 'target\release\' -Force

      - name: Package the Windows installer
        shell: powershell
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^" ]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if (-not $version) { throw 'Could not read the workspace version from Cargo.toml.' }
          $toolsRoot = Join-Path $env:LOCALAPPDATA 'AKRAT\ci-tools'
          $nsisZip = Join-Path $toolsRoot 'nsis-3.13.zip'
          $nsisRoot = Join-Path $toolsRoot 'nsis'
          New-Item -ItemType Directory -Force -Path $toolsRoot | Out-Null
          if (-not (Test-Path -LiteralPath $nsisZip)) { Invoke-WebRequest -Uri 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip' -OutFile $nsisZip }
          $actualHash = (Get-FileHash -Path $nsisZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8') {
            Remove-Item -LiteralPath $nsisZip -Force
            Invoke-WebRequest -Uri 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip' -OutFile $nsisZip
            $actualHash = (Get-FileHash -Path $nsisZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8') { throw "NSIS archive SHA-256 mismatch: $actualHash" }
          }
          Get-ChildItem 'target\release\AKRAT-Setup-*.exe' -ErrorAction SilentlyContinue | Remove-Item -Force
          if (-not (Test-Path -LiteralPath (Join-Path $nsisRoot 'nsis-3.13\makensis.exe'))) { Expand-Archive -Path $nsisZip -DestinationPath $nsisRoot -Force }
          $makensis = Join-Path $nsisRoot 'nsis-3.13\makensis.exe'
          & $makensis /V2 "/DAKRAT_VERSION=$version" 'packaging\windows\akrat-installer.nsi'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "target\release\AKRAT-Setup-v$version.exe")) { throw 'Windows installer was not created.' }
          python scripts/ci/record_artifact_sizes.py windows target/release/akrat-desktop.exe target/release/akrat.exe target/release/akrat-mailbox.exe target/release/akrat-relay.exe target/release/iroh-relay.exe "target/release/AKRAT-Setup-v$version.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: akrat-windows-x64
          path: |
            target/release/akrat-desktop.exe
            target/release/akrat.exe
            target/release/akrat-mailbox.exe
            target/release/akrat-relay.exe
            target/release/iroh-relay.exe
            target/release/akrat-node.sh
            target/release/akrat-node.ps1
            target/release/iroh-relay.toml.example
            target/release/akrat-node.service
            target/release/README.md
            target/release/AKRAT-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akrat-metrics-windows
          path: target/ci-metrics/*.json
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publier la release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, desktop-windows-local, android]
    runs-on: [self-hosted, Linux, X64, akrat-linux-local]
    env:
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.100.0
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - uses: dtolnay/rust-toolchain@1.100.0

      - name: Remove previous release staging files
        shell: bash
        run: python3 -c 'import shutil; shutil.rmtree("dist", ignore_errors=True)'

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          stem="AKRAT-${GITHUB_REF_NAME}-sbom"
          cargo install cargo-cyclonedx --version 0.5.10 --locked --root target/sbom-tools --target-dir target
          for crate in akrat-cli akrat-core akrat-desktop akrat-mailbox akrat-node-updater akrat-relay akrat-trust; do
            target/sbom-tools/bin/cargo-cyclonedx cyclonedx \
              --manifest-path "crates/$crate/Cargo.toml" \
              --format json --target all --override-filename "$stem"
            cp "crates/$crate/$stem.json" "dist/$stem-$crate.json"
          done

      - name: Préparer les archives par plateforme
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          for target in windows-x64 linux-x64; do
            folder="dist/akrat-${target}"
            if [[ "$target" == windows-* ]]; then
              zip -j "dist/AKRAT-${version}-${target}.zip" \
                "$folder/akrat-desktop.exe" "$folder/akrat.exe" "$folder/akrat-mailbox.exe" "$folder/akrat-relay.exe" "$folder/iroh-relay.exe" \
                "$folder/akrat-node.sh" "$folder/akrat-node.ps1" "$folder/iroh-relay.toml.example" "$folder/akrat-node.service" "$folder/README.md"
            else
              chmod +x "$folder/akrat-desktop" "$folder/akrat" "$folder/akrat-mailbox" "$folder/akrat-relay" "$folder/akrat-node-updater" "$folder/iroh-relay" "$folder/akrat-node.sh"
              zip -j "dist/AKRAT-${version}-${target}.zip" \
                "$folder/akrat-desktop" "$folder/akrat" "$folder/akrat-mailbox" "$folder/akrat-relay" "$folder/iroh-relay" \
                "$folder/akrat-node.sh" "$folder/akrat-node.ps1" "$folder/iroh-relay.toml.example" "$folder/akrat-node.service" "$folder/akrat-node-updater" "$folder/akrat-node-updater.service" "$folder/akrat-node-updater.timer" "$folder/akrat-node-updater.json.example" "$folder/README.md"
            fi
          done
          cp dist/akrat-android-apk/app-debug.apk "dist/AKRAT-${version}-android.apk"
          cp dist/akrat-windows-x64/akrat-mailbox.exe "dist/AKRAT-${version}-mailbox-windows-x64.exe"
          cp dist/akrat-linux-x64/akrat-mailbox "dist/AKRAT-${version}-mailbox-linux-x64"
          cp dist/akrat-windows-x64/akrat-relay.exe "dist/AKRAT-${version}-relay-windows-x64.exe"
          cp dist/akrat-linux-x64/akrat-relay "dist/AKRAT-${version}-relay-linux-x64"
          cp dist/akrat-linux-x64/akrat-node-updater "dist/AKRAT-${version}-node-updater-linux-x64"
          cp dist/akrat-windows-x64/iroh-relay.exe "dist/AKRAT-${version}-iroh-relay-windows-x64.exe"
          cp dist/akrat-linux-x64/iroh-relay "dist/AKRAT-${version}-iroh-relay-linux-x64"
          cp dist/akrat-windows-x64/AKRAT-Setup-v"${version#v}".exe "dist/AKRAT-${version}-windows-installer.exe"
          cp "docs/${version}-validation.md" "dist/AKRAT-${version}-validation.md"
          cat > dist/release-notes.md <<EOF
          ## AKRAT ${version}

          Cette version ajoute la sélection prioritaire des relais favoris, tout en conservant la connexion directe prioritaire et le repli sur les relais autorisés. Elle conserve la vérification épinglée d'identité Ed25519, les composants Mailbox et relais indépendants et l’isolation médias du service Mailbox.

          - Windows x64 : installateur, archive portable et CLI
          - Linux x64 : application, CLI, Mailbox, relais et gestionnaire de mises à jour de nœud
          - Android : la compilation de l’APK est vérifiée par la CI ; l’APK signé pour les installations de test est publié séparément.
          - macOS : non compilé pour cette version ; aucun Mac n’est utilisé.

          Le niveau 1 vérifie l'identité Ed25519 épinglée. Le niveau 2 vérifie le manifeste de release signé, son identité de workflow, son commit, le protocole et l'empreinte du binaire déclaré; il ne prouve pas le code effectivement exécuté à distance. L'attestation matérielle de niveau 3, la réputation opérationnelle et les preuves décentralisées de faute restent indisponibles. Le relais transporte le trafic Iroh chiffré sans accéder aux secrets applicatifs. Il peut toujours observer des métadonnées et interrompre le service.

          Les mises à jour de nœuds vérifient l’attestation officielle Ed25519 et l’empreinte signée de chaque binaire avant installation. L’APK Android est signé avec la clé de test persistante du projet.
          EOF
          (cd dist && sha256sum AKRAT-* > SHA256SUMS)

      - name: Sign official release provenance
        shell: bash
        env:
          AKRAT_RELEASE_SIGNING_SEED: ${{ secrets.AKRAT_RELEASE_SIGNING_SEED }}
        run: |
          set -euo pipefail
          python3 scripts/create_release_attestation.py dist
          cargo run --locked --release -p akrat-trust --features release-signer \
            --bin akrat-sign-release-attestation -- \
            "dist/AKRAT-${GITHUB_REF_NAME}-release-attestation.json" \
            "dist/AKRAT-${GITHUB_REF_NAME}-release-attestation.sig"
          for target in windows-x64 linux-x64; do
            folder="dist/akrat-${target}"
            cp "dist/AKRAT-${GITHUB_REF_NAME}-release-attestation.json" "$folder/"
            cp "dist/AKRAT-${GITHUB_REF_NAME}-release-attestation.sig" "$folder/"
            zip -j -u "dist/AKRAT-${GITHUB_REF_NAME}-${target}.zip" \
              "$folder/AKRAT-${GITHUB_REF_NAME}-release-attestation.json" \
              "$folder/AKRAT-${GITHUB_REF_NAME}-release-attestation.sig"
          done
          (cd dist && sha256sum AKRAT-* > SHA256SUMS)

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/AKRAT-"${GITHUB_REF_NAME}"-windows-installer.exe \
            dist/AKRAT-"${GITHUB_REF_NAME}"-windows-x64.zip \
            dist/AKRAT-"${GITHUB_REF_NAME}"-linux-x64.zip \
            dist/AKRAT-"${GITHUB_REF_NAME}"-android.apk \
            dist/AKRAT-"${GITHUB_REF_NAME}"-mailbox-windows-x64.exe \
            dist/AKRAT-"${GITHUB_REF_NAME}"-mailbox-linux-x64 \
            dist/AKRAT-"${GITHUB_REF_NAME}"-relay-windows-x64.exe \
            dist/AKRAT-"${GITHUB_REF_NAME}"-relay-linux-x64 \
            dist/AKRAT-"${GITHUB_REF_NAME}"-node-updater-linux-x64 \
            dist/AKRAT-"${GITHUB_REF_NAME}"-iroh-relay-windows-x64.exe \
            dist/AKRAT-"${GITHUB_REF_NAME}"-iroh-relay-linux-x64 \
            dist/AKRAT-"${GITHUB_REF_NAME}"-sbom-akrat-cli.json \
            dist/AKRAT-"${GITHUB_REF_NAME}"-sbom-akrat-core.json \
            dist/AKRAT-"${GITHUB_REF_NAME}"-sbom-akrat-desktop.json \
            dist/AKRAT-"${GITHUB_REF_NAME}"-sbom-akrat-mailbox.json \
            dist/AKRAT-"${GITHUB_REF_NAME}"-sbom-akrat-node-updater.json \
            dist/AKRAT-"${GITHUB_REF_NAME}"-sbom-akrat-relay.json \
            dist/AKRAT-"${GITHUB_REF_NAME}"-sbom-akrat-trust.json \
            dist/AKRAT-"${GITHUB_REF_NAME}"-validation.md \
            dist/AKRAT-"${GITHUB_REF_NAME}"-release-attestation.json \
            dist/AKRAT-"${GITHUB_REF_NAME}"-release-attestation.sig \
            dist/SHA256SUMS \
            --title "AKRAT ${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md

  android:
    name: Android · APK de test
    needs: desktop
    runs-on: [self-hosted, Linux, X64, akrat-linux-local]
    env:
      CARGO_INCREMENTAL: '1'
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Prepare build metrics directory
        run: python3 -c 'import shutil; shutil.rmtree("target/ci-metrics", ignore_errors=True)'

      - name: Verify Android runner prerequisites
        run: protoc --version

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android

      - name: Install Dioxus CLI
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10"
          tools_root="$HOME/.local/share/akrat-ci/dx-0.7.10"
          archive="$HOME/.local/share/akrat-ci/dx-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$tools_root" "$(dirname "$archive")"
          curl --fail --location --silent --show-error "$base_url/dx-x86_64-unknown-linux-gnu.sha256" -o "$RUNNER_TEMP/dx.sha256"
          expected="$(awk '$2 == "dx-x86_64-unknown-linux-gnu.tar.gz" {print $1}' "$RUNNER_TEMP/dx.sha256")"
          test -n "$expected"
          if [[ ! -f "$archive" ]] || [[ "$(sha256sum "$archive" | awk '{print $1}')" != "$expected" ]]; then
            curl --fail --location --silent --show-error "$base_url/dx-x86_64-unknown-linux-gnu.tar.gz" -o "$archive.tmp"
            echo "$expected  $archive.tmp" | sha256sum --check --status
            mv "$archive.tmp" "$archive"
          fi
          echo "$expected  $archive" | sha256sum --check --status
          if [[ ! -x "$tools_root/dx" ]]; then
            tar -xzf "$archive" -C "$tools_root"
            chmod +x "$tools_root/dx"
          fi
          echo "$tools_root" >> "$GITHUB_PATH"
          "$tools_root/dx" --version

      - name: Clear launcher images from a previous local build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          resources = Path("target/dx/akrat-desktop/release/android/app/app/src/main/res")
          for density in ("mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"):
              (resources / f"mipmap-{density}" / "ic_launcher.png").unlink(missing_ok=True)
          PY

      - name: Build installable Android test APK
        env:
          CARGO_INCREMENTAL: '0'
        run: |
          python3 scripts/ci/measure_process.py android-release -- dx bundle --platform android --target aarch64-linux-android --package akrat-desktop --release --no-default-features --features mobile --package-types apk --out-dir dist/android

      - name: Apply the AKRAT Android launcher icon
        run: |
          python -m pip install Pillow
          python packaging/android/apply_launcher_icon.py \
            --project target/dx/akrat-desktop/release/android/app \
            --icon crates/akrat-desktop/assets/akrat-logo.png
          python3 scripts/ci/measure_process.py android-packaging -- bash target/dx/akrat-desktop/release/android/app/gradlew \
            --project-dir target/dx/akrat-desktop/release/android/app \
            --no-daemon --console=plain :app:assembleDebug
          cp target/dx/akrat-desktop/release/android/app/app/build/outputs/apk/debug/app-debug.apk \
            dist/android/app-debug.apk

      - name: Sign APK with the persistent AKRAT test key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.AKRAT_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ]]; then
            echo "Missing repository secret AKRAT_ANDROID_DEBUG_KEYSTORE_BASE64" >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/akrat-debug.keystore"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          apk="dist/android/app-debug.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$RUNNER_TEMP/akrat-signed.apk" \
            "$apk"
          mv "$RUNNER_TEMP/akrat-signed.apk" "$apk"
          "$apksigner" verify --verbose "$apk"
          python3 scripts/ci/record_artifact_sizes.py android "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: akrat-android-apk
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akrat-metrics-android
          path: target/ci-metrics/*.json
          if-no-files-found: ignore
          retention-days: 14
