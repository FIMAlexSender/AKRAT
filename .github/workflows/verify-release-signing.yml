name: Verify AKRAT release signing key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signing-key:
    name: Verify signing key against production trust root
    runs-on: [self-hosted, Linux, X64, akrat-linux-local]
    env:
      CARGO_INCREMENTAL: '1'
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - uses: dtolnay/rust-toolchain@1.100.0

      - name: Sign and verify an ephemeral release fixture
        shell: bash
        env:
          AKRAT_RELEASE_SIGNING_SEED: ${{ secrets.AKRAT_RELEASE_SIGNING_SEED }}
        run: |
          set -euo pipefail
          test -n "$AKRAT_RELEASE_SIGNING_SEED"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          artifact="$temp_dir/AKRAT-v0.1.13-node-updater-linux-x64"
          cp /bin/true "$artifact"
          python3 - "$temp_dir" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import sys
          import time

          root = pathlib.Path(sys.argv[1])
          artifact = root / "AKRAT-v0.1.13-node-updater-linux-x64"
          attestation = {
              "schema": "akrat-release-attestation/v1",
              "repository": "FIMAlexSender/AKRAT",
              "tag": "v0.1.13",
              "version": "0.1.13",
              "source_commit": os.environ["GITHUB_SHA"].lower(),
              "workflow": ".github/workflows/build.yml",
              "workflow_ref": "FIMAlexSender/AKRAT/.github/workflows/build.yml@refs/tags/v0.1.13",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "issued_unix_seconds": int(time.time()),
              "protocol_version": 1,
              "assets": [{
                  "name": artifact.name,
                  "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              }],
          }
          (root / "manifest.json").write_text(
              json.dumps(attestation, separators=(",", ":")) + "\n", encoding="utf-8"
          )
          PY
          cargo run --locked -p akrat-trust --features release-signer \
            --bin akrat-sign-release-attestation -- \
            "$temp_dir/manifest.json" "$temp_dir/manifest.sig"
          cargo run --locked -p akrat-node-updater -- verify \
            --manifest "$temp_dir/manifest.json" \
            --signature "$temp_dir/manifest.sig" \
            --artifact "$artifact" \
            --asset-name "$(basename "$artifact")"
